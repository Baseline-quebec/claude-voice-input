[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-voice-input"
version = "0.1.0"
description = "MCP server for local voice input using Whisper — speak to Claude, don't type."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
claude-voice-input = "claude_voice_input.server:main"
